name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} macOS build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    env:
      PYTHON: python3
      HIGHLIGHT_DESK_KEYCHAIN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test media tools
        run: brew install ffmpeg

      - name: Fetch Sparkle
        run: ./tools/fetch-sparkle.sh

      - name: Build bundled LGPL FFmpeg + Streamlink
        run: ./tools/build-runtime.sh

      - name: Tests with bundled runtime
        run: |
          PATH="$PWD/mac/runtime/$(uname -m)/bin:$PATH" npm test
          npm run check

      - name: Build app
        run: ./mac/build.sh

      - name: Verify app
        run: |
          codesign --verify --deep --strict "mac/build/Highlight Desk.app"
          test -x "mac/build/Highlight Desk.app/Contents/Resources/runtime/bin/ffmpeg"
          test -x "mac/build/Highlight Desk.app/Contents/Resources/runtime/bin/streamlink"
          test -d "mac/build/Highlight Desk.app/Contents/Frameworks/Sparkle.framework"

      - name: Package unsigned artifact
        run: |
          mkdir -p mac/build/artifact
          ditto -c -k --keepParent "mac/build/Highlight Desk.app" "mac/build/artifact/HighlightDesk-${RUNNER_ARCH}.zip"
          hdiutil create -volname "Highlight Desk" -srcfolder "mac/build/Highlight Desk.app" -ov -format UDZO "mac/build/artifact/HighlightDesk-${RUNNER_ARCH}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighlightDesk-${{ matrix.arch }}-unsigned
          path: mac/build/artifact/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows engine tests
    runs-on: windows-latest
    env:
      HIGHLIGHT_DESK_KEYCHAIN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same pinned, hash-verified LGPL FFmpeg the app ships. (Chocolatey's
      # package feed returned 503 once and "succeeded" with nothing installed,
      # which silently skipped every test that needs FFmpeg.)
      - name: Fetch the pinned LGPL FFmpeg and Streamlink
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/fetch-runtime-win.ps1
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\runtime\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\runtime\streamlink\bin"

      # Several tests skip when FFmpeg is missing, so a broken setup would
      # otherwise look green. Fail the job instead.
      - name: Fail if FFmpeg or ffprobe is missing
        shell: pwsh
        run: |
          # Capture first: piping a native command into Select-Object -First 1
          # closes the pipe early, which makes PowerShell report a failure.
          $ffmpegVersion = ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ffmpegVersion | Select-Object -First 1
          $ffprobeVersion = ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ffprobeVersion | Select-Object -First 1
      - name: Tests
        run: npm test
      - name: Syntax check
        run: npm run check

  windows-runtime:
    name: Windows bundled runtime
    runs-on: windows-latest
    env:
      HIGHLIGHT_DESK_KEYCHAIN: "0"
      HIGHLIGHT_DESK_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pins live in tools/runtime-win.json. While they are empty this step
      # discovers and prints them (see the job summary) so they can be committed,
      # and the last step of the job fails until they are.
      - name: Fetch the LGPL FFmpeg and portable Streamlink
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pins = Get-Content -Raw tools/runtime-win.json | ConvertFrom-Json
          $pinned = [bool]($pins.ffmpeg.sha256 -and $pins.streamlink.sha256)
          "RUNTIME_PINNED=$pinned" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($pinned) { ./tools/fetch-runtime-win.ps1 } else { ./tools/fetch-runtime-win.ps1 -Discover }

      # PATH is cut down to the bundled binaries, Node and Windows itself, so no
      # system FFmpeg or Streamlink can be picked up by mistake.
      - name: Verify and test with only the bundled runtime
        shell: pwsh
        run: |
          $node = Split-Path (Get-Command node).Source
          $env:PATH = "$PWD\runtime\bin;$PWD\runtime\streamlink\bin;$node;C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          "ffmpeg   : $((Get-Command ffmpeg).Source)"
          "streamlink: $((Get-Command streamlink).Source)"
          node tools/verify-runtime.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/run-tests.js test/e2e-clip.test.js test/windows-priority.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # The software encoder a Windows "N" edition (no Media Foundation) would fall
          # back to: force it and make the same real clip, so it is proven, not assumed.
          $env:HIGHLIGHT_DESK_ENCODER = "libopenh264"
          node tools/run-tests.js test/e2e-clip.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Require pinned downloads
        if: env.RUNTIME_PINNED != 'True'
        shell: pwsh
        run: |
          Write-Host "::error::The runtime is not pinned. Copy the tag, asset and sha256 from the job summary into tools/runtime-win.json."
          exit 1

  # Signed/notarized releases are intentionally manual until Apple, OAuth,
  # Lemon Squeezy, and Sparkle release credentials are configured.
  preflight:
    name: Release preflight docs
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show release gate
        run: |
          echo "Signed release is manual: ./mac/release.sh --check then ./mac/release.sh"
          echo "See docs/RELEASE.md and docs/UPDATE.md."
